name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm type-check

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nomora_test
          POSTGRES_PASSWORD: nomora_test
          POSTGRES_DB: nomora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nomora_test -d nomora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/server
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nomora_test:nomora_test@localhost:5432/nomora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
